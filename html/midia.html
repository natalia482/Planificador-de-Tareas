<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>

    <!-- Bootstrap CSS (5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Electrolize&family=Fascinate&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header class="text-center py-4">
        <h1 class="titulo-header m-0">Planificador de Tareas</h1>
    </header>

    <!-- Navegación Principal -->
    <div class="container my-3">
        <ul class="nav nav-tabs justify-content-center border-0 p-2 rounded-3 shadow-sm nav-custom">
            <li class="nav-item">
                <a class="nav-link" aria-current="page" href="../index.html">
                    <i class="bi bi-house me-1"></i> Inicio
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../html/midia.html">
                    <i class="bi bi-brightness-high me-1"></i> Mi día
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-calendar-check me-1"></i> Calendario
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-folder me-1"></i> Proyectos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-grid-1x2 me-1"></i> Categorías
                </a>
            </li>
        </ul>
    </div>

    <!--Fecha, Buscador, btn crear tarea-->
    <main class="container my-4">
        <!-- Encabezado de Sección + Botón Nueva Tarea -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="subtitulo-seccion m-0">Tareas de hoy</h2>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <button class="btn btn-principal d-flex align-items-center gap-2" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNuevaTarea" aria-controls="offcanvasNuevaTarea">
                <i class="bi bi-plus-square fs-5"></i>
                <span>Nueva Tarea</span>
            </button>
        </div>
    </main>

    <!-- Contenedor / Lista de Tareas -->
    <div class="row g-4" id="contenedor-tareas"></div>
    <!--Barra de progreso-->
    <h2 class="subtitulo-seccion m-0 py-2   ">Progreso</h2>
    <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0"
        aria-valuemax="100">
        <div class="progress-bar" style="width: 25%"></div>
    </div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--JS -->
    <script src="../js/taskManager.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
