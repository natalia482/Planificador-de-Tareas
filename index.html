<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>

    <!-- Bootstrap CSS (5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Electrolize&family=Fascinate&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="text-center py-4">
        <h1 class="titulo-header m-0">Planificador de Tareas</h1>
    </header>

    <!-- Navegación Principal -->
    <div class="container my-3">
        <ul class="nav nav-tabs justify-content-center border-0 p-2 rounded-3 shadow-sm nav-custom">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">
                    <i class="bi bi-house me-1"></i> Inicio
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="./html/midia.html">
                    <i class="bi bi-brightness-high me-1"></i> Mi día
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-calendar-check me-1"></i> Calendario
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-folder me-1"></i> Proyectos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-grid-1x2 me-1"></i> Categorías
                </a>
            </li>
        </ul>
    </div>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <!-- Encabezado de Sección + Botón Nueva Tarea -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="subtitulo-seccion m-0">Mis Tareas</h2>
            <button class="btn btn-principal d-flex align-items-center gap-2" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNuevaTarea" aria-controls="offcanvasNuevaTarea">
                <i class="bi bi-plus-square fs-5"></i>
                <span>Nueva Tarea</span>
            </button>
        </div>

        <!-- Filtros de Tareas -->
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-filtro active" type="button">Todas</button>
            <button class="btn btn-filtro" type="button">Proyectos</button>
            <button class="btn btn-filtro" type="button">Importantes</button>
        </div>


        <!-- Contenedor / Lista de Tareas -->
        <div class="row g-4" id="contenedor-tareas"></div>

    </main>

    <!-- Offcanvas: Modal inferior para Agregar Tarea -->
    <div class="offcanvas offcanvas-bottom rounded-top-4 h-auto" tabindex="-1" id="offcanvasNuevaTarea"
        aria-labelledby="offcanvasNuevaTareaLabel">
        <!--Titulo de Modal-->
        <div class="offcanvas-header border-bottom">
            <h3 class="offcanvas-title d-flex align-items-center gap-2" id="offcanvasNuevaTareaLabel">
                <i class="bi bi-plus-square text-primary"></i> Nueva Tarea
            </h3>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>


        <div class="offcanvas-body py-4">
            <form class="container" id="form-Planificador" style="max-width: 800px;">
                <div class="row g-3">

                    <!-- Nombre del Proyecto -->
                    <div class="col-12 ">
                        <label for="inputProyecto" class="form-label small fw-bold">Nombr Proyecto</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-archive"></i></span>
                            <input type="text" class="form-control" id="inputProyecto" placeholder="Ej. Rediseño Web">
                        </div>
                    </div>

                    <!-- Nombre de la Tarea -->
                    <div class="col-12">
                        <label for="inputTarea" class="form-label small fw-bold">Nombre de la tarea</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-check2-square"></i></span>
                            <input type="text" class="form-control" id="inputTarea"
                                placeholder="Ej. Diseñar componentes de UI">
                        </div>
                    </div>

                    <!-- Descripción / Detalles -->
                    <div class="col-12">
                        <label for="textareaDescripcion" class="form-label small fw-bold">Descripción</label>
                        <div class="form-floating">
                            <textarea class="form-control" id="textareaDescripcion"
                                placeholder="Detalles de la tarea..." style="height: 100px"></textarea>
                            <label for="textareaDescripcion">Escribe los detalles aquí...</label>
                        </div>
                    </div>

                    <!-- Nivel de Importancia / Matriz de Eisenhower -->
                    <div class="col-12">
                        <label for="selectPrioridad" class="form-label small fw-bold">Prioridad (Matriz
                            Eisenhower)</label>
                        <div class="form-floating">
                            <select class="form-select" id="selectPrioridad" aria-label="Seleccionar prioridad">
                                <option selected disabled value="">Selecciona la prioridad...</option>
                                <option value="1">Urgente e Importante (Hacer ahora)</option>
                                <option value="2">Importante pero No Urgente (Planificar)</option>
                                <option value="3">Urgente pero No Importante (Delegar)</option>
                                <option value="4">Ni Urgente ni Importante (Eliminar)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Fecha de entrega -->
                    <div class="col-12">
                        <label for="inputFecha" class="form-label small fw-bold">Fecha de entrega</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-check2-square"></i></span>
                            <input type="date" class="form-control" id="inputFecha"
                                placeholder=" Fecha de finalización de la tarea">
                        </div>
                    </div>

                    <!-- Contenedor donde se mostrarán las alertas -->
                    <div id="contenedor-alertas" class="container my-3"></div>

                    <!-- Botón de guardar -->
                    <div class="col-12 mt-4 text-end">
                        <button type="button" class="btn btn-secondary me-2"
                            data-bs-dismiss="offcanvas">Cancelar</button>
                        <button type="submit" class="btn btn-principal">Guardar Tarea</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--JS -->
    <script src="./js/taskManager.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
